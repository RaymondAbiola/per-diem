[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.33"

# This contract reimburses measured gas, so runtime cost is the product, not an
# afterthought. Optimize hard for the hot path.
optimizer = true
optimizer_runs = 10_000

# Pinned to cancun, not foundry's prague default. Evidence: arc-meter, live on Arc
# mainnet at 0x1f4e93cc, carries PUSH0 and MCOPY in its deployed bytecode, so Arc is
# at least cancun. Nothing confirms prague, so we do not compile for it.
evm_version = "cancun"

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"

[fmt]
line_length = 100
